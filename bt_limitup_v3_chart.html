].map(([l,v,c,n])=>`<div class="kpi"><div class="label">${l}</div><div class="val ${c}">${v}</div><div class="note">${n||''}</div></div>`).join('');

// ---------- SVG helper ----------
function svgEl(tag, attrs){ const e=document.createElementNS('http://www.w3.org/2000/svg',tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

// 累计收益曲线（面积+折线+散点） 与 单笔收益柱（右轴）
(function(){
  const data = DATA.curve, W=1050, H=330, padL=62, padR=56, padT=22, padB=36;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxC=Math.max(...data.map(d=>d.cum)), minC=Math.min(0,...data.map(d=>d.cum));
  const cRng=(maxC-minC)||1;
  const maxN=Math.max(...data.map(d=>d.net)), minN=Math.min(...data.map(d=>d.net));
  const nRng=(maxN-minN)||1;
  const X=i=>padL+ i/(data.length-1)*iw;
  const YC=v=>padT+ih-(v-minC)/cRng*ih;
  const YN=v=>padT+ih-(v-minN)/nRng*ih;
  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`});
  // 网格线
  for(let g=0;g<=4;g++){ const y=padT+ih*g/4;
    svg.appendChild(svgEl('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'#2a3550','stroke-width':0.7}));
    const v=Math.round(minC+cRng*g/4); const t=svgEl('text',{x:padL-8,y:y+4,fill:'#8b98b5','font-size':11, 'text-anchor':'end'}); t.textContent=v; svg.appendChild(t);
  }
  // 右轴
  for(let g=0;g<=4;g++){ const y=padT+ih*g/4;
    const v=Math.round(minN+nRng*g/4); const t=svgEl('text',{x:W-padR+8,y:y+4,fill:'#5c6a8c','font-size':10}); t.textContent=v; svg.appendChild(t);
  }
  // 单笔收益柱
  data.forEach((d,i)=>{ const x=X(i); const y0=YN(0), y1=YN(d.net);
    svg.appendChild(svgEl('rect',{x:x-1.2,y:Math.min(y0,y1),width:2.4,height:Math.abs(y1-y0)||0.8,fill:d.net>=0?'rgba(46,204,113,0.30)':'rgba(231,76,111,0.30)'}));
  });
  // 累计折线
  let pathC='', pathA='';
  data.forEach((d,i)=>{ pathC+=(i?'L':'M')+X(i).toFixed(1)+','+YC(d.cum).toFixed(1);
    pathA+=(i?'L':'M')+X(i).toFixed(1)+','+YC(d.cum).toFixed(1); });
  pathA+='L'+X(data.length-1).toFixed(1)+','+YC(minC).toFixed(1)+'L'+X(0).toFixed(1)+','+YC(minC).toFixed(1)+'Z';
  svg.appendChild(svgEl('path',{d:pathA,fill:'rgba(74,144,217,0.14)',stroke:'none'}));
  svg.appendChild(svgEl('path',{d:pathC,fill:'none',stroke:'#4a90d9','stroke-width':2.2,'stroke-linejoin':'round'}));
  // 日期刻度 (约8个)
  const step=Math.ceil(data.length/8);
  for(let i=0;i<data.length;i+=step){ const t=svgEl('text',{x:X(i),y:H-padB+18,fill:'#8b98b5','font-size':10.5,'text-anchor':'middle'}); t.textContent=data[i].date; svg.appendChild(t); }
  // 末尾标记
  const last=data[data.length-1];
  const lt=svgEl('text',{x:X(data.length-1)-8,y:YC(last.cum)-8,fill:'#4a90d9','font-size':12,'font-weight':700,'text-anchor':'end'});
  lt.textContent='+'+last.cum.toLocaleString(); svg.appendChild(lt);
  // tooltip
  const tip=document.getElementById('tip');
  svg.addEventListener('mousemove', e=>{
    const r=svg.getBoundingClientRect(); const mx=(e.clientX-r.left)/r.width*W;
    let idx=Math.round((mx-padL)/iw*(data.length-1)); idx=Math.max(0,Math.min(data.length-1,idx));
    const d=data[idx];
    tip.innerHTML=`<b>${d.date}</b> ${d.code} ${d.name}<br>净收益 <span class="${d.net>=0?'pos':'neg'}">${fmtKpi(d.net)}</span> (${d.ret>=0?'+':''}${d.ret}%)<br>累计 <b>${fmtKpi(d.cum)}</b> · 持有${d.hold}天 · ${REASON_LABEL[d.reason]||d.reason}`;
    tip.style.opacity=1; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+10)+'px';
  });
  svg.addEventListener('mouseleave', ()=>tip.style.opacity=0);
  document.getElementById('curveChart').appendChild(svg);
})();

// ---------- 分段柱状图 ----------
(function(){
  const seg=DATA.seg, W=560, H=300, padL=52, padR=14, padT=20, padB=64;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxV=Math.max(...seg.map(s=>s.sum),0), minV=Math.min(...seg.map(s=>s.sum),0);
  const rng=(maxV-minV)||1;
  const bw=Math.min(58, iw/seg.length*0.62);
  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`});
  for(let g=0;g<=4;g++){ const y=padT+ih*g/4;
    svg.appendChild(svgEl('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'#2a3550','stroke-width':0.7}));
    const v=Math.round(minV+rng*g/4); const t=svgEl('text',{x:padL-8,y:y+4,fill:'#8b98b5','font-size':10.5,'text-anchor':'end'}); t.textContent=v; svg.appendChild(t);
  }
  const Y=v=>padT+ih-(v-minV)/rng*ih;
  seg.forEach((s,i)=>{
    const x=padL+iw*(i+0.5)/seg.length-bw/2;
    const y0=Y(0), y1=Y(s.sum);
    const col=SEG_COLORS[i]||'#4a90d9';
    svg.appendChild(svgEl('rect',{x:x,y:Math.min(y0,y1),width:bw,height:Math.max(1,Math.abs(y1-y0)),fill:s.sum>=0?col+'CC':col+'AA',rx:3}));
    const t=svgEl('text',{x:x+bw/2,y:y1+(s.sum>=0?-8:16),fill:s.sum>=0?'#2ecc71':'#e74c6f','font-size':11.5,'font-weight':600,'text-anchor':'middle'});
    t.textContent=(s.sum>0?'+':'')+s.sum.toLocaleString(); svg.appendChild(t);
    const l=svgEl('text',{x:x+bw/2,y:H-padB+14,fill:'#c6d2ee','font-size':10.5,'text-anchor':'middle'}); l.textContent=s.name; svg.appendChild(l);
    const n=svgEl('text',{x:x+bw/2,y:H-padB+30,fill:'#8b98b5','font-size':10,'text-anchor':'middle'}); n.textContent=s.n+'笔 · 胜率'+s.wr+'%'; svg.appendChild(n);
  });
  document.getElementById('segChart').appendChild(svg);
})();

// ---------- 直方图 ----------
(function(){
  const hist=DATA.hist, W=560, H=300, padL=40, padR=14, padT=20, padB=52;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxN=Math.max(...hist.map(h=>h.n));
  const bw=iw/hist.length*0.66;
  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`});
  for(let g=0;g<=4;g++){ const y=padT+ih*g/4;
    svg.appendChild(svgEl('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'#2a3550','stroke-width':0.7}));
    const t=svgEl('text',{x:padL-8,y:y+4,fill:'#8b98b5','font-size':10.5,'text-anchor':'end'}); t.textContent=Math.round(maxN*g/4); svg.appendChild(t);
  }
  hist.forEach((h,i)=>{
    const x=padL+iw*(i+0.5)/hist.length-bw/2;
    const hgt=ih*h.n/maxN;
    const col=h.lo<0?'rgba(231,76,111,0.75)':'rgba(46,204,113,0.75)';
    svg.appendChild(svgEl('rect',{x:x,y:padT+ih-hgt,width:bw,height:Math.max(1,hgt),fill:col,rx:2}));
    const t=svgEl('text',{x:x+bw/2,y:padT+ih-hgt-5,fill:'#c6d2ee','font-size':10.5,'text-anchor':'middle'}); t.textContent=h.n; svg.appendChild(t);
    const l=svgEl('text',{x:x+bw/2,y:H-padB+14,fill:'#8b98b5','font-size':9.5,'text-anchor':'middle'}); l.textContent=h.label; svg.appendChild(l);
  });
  document.getElementById('histChart').appendChild(svg);
})();

// ---------- 卖出原因 ----------
(function(){
  const rs=DATA.reasons, W=560, H=300, padL=92, padR=30, padT=24, padB=46;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxN=Math.max(...rs.map(r=>r.n));
  const rowH=ih/rs.length;
  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`});
  const colors={stop_loss:'#e74c6f',trail_stop:'#2ecc71',time_stop:'#f5a623'};
  const total=rs.reduce((a,r)=>a+r.n,0);
  rs.forEach((r,i)=>{
    const y=padT+i*rowH+rowH*0.28;
    const l=svgEl('text',{x:padL-10,y:y+rowH*0.42,fill:'#c6d2ee','font-size':12,'text-anchor':'end'}); l.textContent=r.label; svg.appendChild(l);
    const w=iw*r.n/maxN;
    svg.appendChild(svgEl('rect',{x:padL,y:y,width:Math.max(2,w),height:rowH*0.44,fill:colors[r.k]||'#4a90d9',rx:3}));
    const t=svgEl('text',{x:padL+w+8,y:y+rowH*0.44-2,fill:'#e8edf7','font-size':12,'font-weight':600}); t.textContent=r.n+' 笔 ('+(r.n/total*100).toFixed(0)+'%)'; svg.appendChild(t);
  });
  // 注释
  const note=svgEl('text',{x:padL,y:H-14,fill:'#5c6a8c','font-size':11});
  note.textContent='移动止盈(利润奔跑) 44% + 硬止损 38% + 时间止损 18%'; svg.appendChild(note);
  document.getElementById('reasonChart').appendChild(svg);
})();

// ---------- 盈亏表 ----------
function buildTable(id, list, pos){
  const tb=document.getElementById(id);
  tb.innerHTML='<tr><th>日期</th><th>代码</th><th>名称</th><th>收益率</th><th>净收益</th><th>原因</th></tr>'+
    list.map(t=>`<tr><td>${t.buy}→${t.sell}</td><td>${t.code}</td><td>${t.name}</td>
      <td class="${t.ret>=0?'pos':'neg'}">${t.ret>=0?'+':''}${t.ret}%</td>
      <td class="${t.net>=0?'pos':'neg'}">${fmtKpi(t.net)}</td>
      <td><span class="chip ${t.reason}">${REASON_LABEL[t.reason]||t.reason}</span></td></tr>`).join('');
}
const curve=DATA.curve;
buildTable('winTable', curve.slice().sort((a,b)=>b.net-a.net).slice(0,8), true);
buildTable('lossTable', curve.slice().sort((a,b)=>a.net-b.net).slice(0,8), false);

// ---------- 按年收益 ----------
(function(){
  const yr = DATA.yearly||[];
  if(!yr.length) return;
  const tb = document.getElementById('yearTable');
  tb.innerHTML = '<tr><th>年份</th><th>笔数</th><th>胜率</th><th>净收益</th><th>平均/笔</th></tr>' +
    yr.map(y=>`<tr><td><b>${y.year}</b></td><td>${y.n}</td><td>${y.wr}%</td>
      <td class="${y.net>=0?'pos':'neg'}">${fmtKpi(y.net)}</td>
      <td class="${y.net>=0?'pos':'neg'}">${fmtKpi(Math.round(y.net/y.n))}</td></tr>`).join('');
})();
</script>
