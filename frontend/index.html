<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SClaw — 鹰爪</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* === Pre-mount loading skeleton === */
      body { margin:0; background:#0a0b0e; color:#a0a5b0; font-family:Inter, system-ui, sans-serif; }
      #root { min-height:100vh; }
      #root:empty .sclaw-splash {
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        min-height:100vh; gap:12px;
      }
      #root:empty .sclaw-splash .logo {
        font-family:'DM Serif Display', serif; font-size:2.5rem;
        color:#c49a6c; letter-spacing:0.05em;
      }
      #root:empty .sclaw-splash .loader {
        width:24px; height:24px; border:2px solid rgba(196,154,108,0.2);
        border-top-color:#c49a6c; border-radius:50%;
        animation:spin 0.8s linear infinite;
      }
      #root:empty .sclaw-splash .tagline {
        font-size:0.75rem; color:#6b7280;
      }
      @keyframes spin { to { transform:rotate(360deg); } }
      #root:not(:empty) .sclaw-splash { display:none; }
    </style>
  </head>
<body class="bg-stock-bg text-stock-text min-h-screen antialiased">
    <div id="root">
      <div class="sclaw-splash">
        <span class="logo">SClaw</span>
        <div class="loader"></div>
        <span class="tagline">鹰爪 · 市场猎手</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
